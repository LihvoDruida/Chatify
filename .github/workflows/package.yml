name: Continuous Integration

# validate: every push to main, every pull request and every release tag.
# release:  only a pushed tag, and only after validate is green.
# Re-pushing a tag re-runs both jobs (the release is published again).
on:
  push:
    branches: [main]
    tags:
      - "*"           # Будь-який тег запускає реліз...
      - "!**-alpha**" # ...крім тегів з суфіксом -alpha
      - "!**-beta**"  # ...та -beta
  pull_request:

permissions:
  contents: read

env:
  # Real Ace3 for the AceGUI UI/UX and AceDB persistence tests. The packager
  # fetches Ace3 from wowace (.pkgmeta externals); this is its GitHub mirror.
  ACE3_REPO: https://github.com/WoWUIDev/Ace3
  ACE3_REF: Release-r1403

jobs:
  validate:
    name: Source validation (Lua 5.1)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          command -v lua5.1
          command -v luac5.1
          python3 -m pip install --quiet fonttools pillow

      - name: Fetch Ace3 for real-library tests
        run: |
          git clone --quiet --depth 1 --branch "$ACE3_REF" "$ACE3_REPO" "$RUNNER_TEMP/Ace3"
          echo "ACE3_PATH=$RUNNER_TEMP/Ace3" >> "$GITHUB_ENV"

      - name: Required checks (real AceGUI mandatory)
        env:
          CHATIFY_REQUIRE_REAL_ACEGUI: "1"
        run: bash ./tools/check_all.sh

      - name: Real AceDB persistence round trip
        env:
          CHATIFY_REQUIRE_REAL_ACEDB: "1"
        run: lua5.1 tools/roundtrip_test.lua

      - name: Prove failure detection
        run: bash ./tools/negative_control.sh

  release:
    name: Package and publish
    needs: validate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: chatify-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      # The version is the tag that triggered this run, never the newest tag
      # reachable from HEAD and never the developer version in the TOCs.
      - name: Update Version in .toc Files
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = "tag" || { echo "Not a tag build" >&2; exit 1; }
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$CLEAN_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "Tag '${GITHUB_REF_NAME}' is not a version (expected v1.2.3 or 1.2.3)" >&2; exit 1; }
          updated=0
          while IFS= read -r -d '' toc_file; do
            grep -q '^## Version: ' "$toc_file" || { echo "No ## Version in $toc_file" >&2; exit 1; }
            sed -i "s/^## Version: .*/## Version: ${CLEAN_VERSION}/" "$toc_file"
            echo "Оновлення версії в файлі: $toc_file до $CLEAN_VERSION"
            updated=$((updated+1))
          done < <(find . -maxdepth 1 -type f -name '*.toc' -print0)
          test "$updated" -gt 0 || { echo "No TOC files found" >&2; exit 1; }
          python3 tools/generate_tocs.py --check
          echo "FINAL_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "CLEAN_VERSION=${CLEAN_VERSION}" >> "$GITHUB_ENV"

      # Генеруємо changelog (потрібен файл cliff.toml у корені)
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output CHANGELOG.md

      - name: Verify Changelog
        run: test -s CHANGELOG.md

      # Пакування та відправка на CurseForge / GitHub Releases
      - name: Create and Upload Package
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}     # Токен CurseForge
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} # Токен GitHub (автоматичний)

      - name: Add Summary
        run: |
          echo "## ✅ Реліз $FINAL_VERSION опубліковано (TOC: $CLEAN_VERSION)" >> "$GITHUB_STEP_SUMMARY"
