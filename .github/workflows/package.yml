name: Continuous Integration

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Required source validation (Lua 5.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install required Lua 5.1 runtime and parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          command -v lua5.1
          command -v luac5.1
      - name: Required checks (no optional skips)
        run: bash ./tools/check_all.sh
      - name: Prove failure detection
        run: bash ./tools/negative_control.sh


  package-preflight:
    name: Pre-release packaged ZIP validation (embedded libraries)
    needs: validate
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and synchronize TOC versions
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = "tag" || exit 1
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$CLEAN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"
          while IFS= read -r -d '' toc_file; do
            grep -q '^## Version: ' "$toc_file" || exit 1
            sed -i "s/^## Version: .*/## Version: ${CLEAN_VERSION}/" "$toc_file"
          done < <(find . -type f -name '*.toc' -print0)
          python3 tools/generate_tocs.py --check

      # -d = create full ZIP and fetch externals, but DO NOT upload.
      # This gate executes before the actual publishing job.
      - name: Build offline-upload preview with vendored externals
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verify the actual install ZIP (never SOURCE/overlay)
        shell: bash
        run: |
          mapfile -d '' packages < <(find .release -maxdepth 2 -type f -name '*.zip' -print0)
          test "${#packages[@]}" -eq 1 || {
            echo "Expected exactly one built ZIP, found ${#packages[@]}" >&2
            exit 1
          }
          python3 tools/validate_package.py "${packages[0]}" --expected-version "$CLEAN_VERSION" --json-report package-preflight.json

      - name: Save package validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatify-package-preflight
          path: package-preflight.json
          if-no-files-found: ignore

  build:
    needs: [validate, package-preflight]
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    outputs:
      changeLogText: ${{ steps.readChanglog.outputs.text }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Resolve version from triggering Git tag
        shell: bash
        run: |
          # Never use a local TOC value or git describe for the release version.
          test "${GITHUB_REF_TYPE}" = "tag" || {
            echo "Release blocked: the workflow was not triggered by a tag" >&2
            exit 1
          }
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release blocked: invalid version tag '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "FINAL_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Print Debug Info
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Використана версія: $FINAL_VERSION"

      - name: Update Version in .toc Files
        shell: bash
        run: |
          # All packaged TOC metadata must use the triggering tag, not local versions.
          # Strip an optional leading v (e.g. v2.18.5 -> 2.18.5).
          test -n "${FINAL_VERSION:-}" || { echo "FINAL_VERSION is empty" >&2; exit 1; }
          CLEAN_VERSION=$(echo "${FINAL_VERSION}" | sed 's/^v//')
          updated=0
          while IFS= read -r -d '' toc_file; do
            if ! grep -q '^## Version: ' "$toc_file"; then
              echo "Missing Version directive in $toc_file" >&2
              exit 1
            fi
            echo "Оновлення версії в файлі: $toc_file до $CLEAN_VERSION"
            sed -i "s/^## Version: .*/## Version: ${CLEAN_VERSION}/" "$toc_file"
            grep -Fxq "## Version: ${CLEAN_VERSION}" "$toc_file" || {
              echo "Unable to update Version in $toc_file" >&2
              exit 1
            }
            updated=$((updated + 1))
          done < <(find . -type f -name '*.toc' -print0)
          test "$updated" -gt 0 || { echo "No TOC files found" >&2; exit 1; }
          python3 tools/generate_tocs.py --check
          echo "Synced $updated TOC files to tag ${FINAL_VERSION}"

      # Генеруємо changelog (потрібен файл cliff.toml у корені)
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output CHANGELOG.md

      - name: Verify Changelog
        run: test -s CHANGELOG.md && cat CHANGELOG.md

      # Пакування та відправка на CurseForge / GitHub Releases
      - name: Create and Upload Package
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}  # Токен CurseForge
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }} # Токен GitHub (автоматичний)

      - name: Add Summary
        run: |
          echo "## ✅ CI завершено успішно для версії $FINAL_VERSION" >> $GITHUB_STEP_SUMMARY